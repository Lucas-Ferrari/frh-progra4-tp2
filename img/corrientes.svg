<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ilustración de la Avenida Corrientes de noche, con el Obelisco al fondo y la sucursal de Banco Andino en la esquina</title>
  <!-- Ilustración plana: solo colores de la paleta (violetas, tinta, dorado del chip) -->

  <!-- Animaciones: el colectivo cruza y algunas ventanas se prenden y apagan.
       La media query respeta "reducir movimiento" también dentro del SVG. -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .colectivo { animation: cruzar 16s linear infinite; }
      .luz { animation: titilar 7s steps(1) infinite; }
      .luz-2 { animation-delay: -2.3s; }
      .luz-3 { animation-delay: -4.6s; }
    }
    @keyframes cruzar {
      from { transform: translateX(-340px); }
      to { transform: translateX(660px); }
    }
    @keyframes titilar {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0.15; }
    }
  </style>

  <!-- Cielo nocturno -->
  <rect width="800" height="560" fill="#15131f"/>
  <circle cx="640" cy="92" r="34" fill="#efeafd"/>
  <circle cx="626" cy="84" r="34" fill="#15131f"/>
  <g fill="#efeafd">
    <circle cx="90" cy="60" r="2"/><circle cx="210" cy="110" r="1.6"/><circle cx="330" cy="48" r="2"/>
    <circle cx="470" cy="90" r="1.6"/><circle cx="740" cy="160" r="2"/><circle cx="560" cy="40" r="1.6"/>
  </g>

  <!-- Edificios del fondo -->
  <g fill="#2a2440">
    <rect x="0" y="210" width="120" height="250"/>
    <rect x="110" y="250" width="90" height="210"/>
    <rect x="560" y="230" width="110" height="230"/>
    <rect x="660" y="190" width="140" height="270"/>
  </g>

  <!-- Obelisco -->
  <polygon points="400,96 386,124 386,420 414,420 414,124" fill="#f1f0f6"/>
  <polygon points="400,96 400,124 414,124 414,420 400,420" fill="#d6d2e6"/>
  <rect x="396" y="150" width="8" height="10" fill="#15131f"/>

  <!-- Edificios del frente, a la izquierda -->
  <rect x="0" y="290" width="170" height="170" fill="#4520c4"/>
  <rect x="160" y="320" width="150" height="140" fill="#5a2ee5"/>
  <!-- Edificios del frente, a la derecha -->
  <rect x="500" y="310" width="140" height="150" fill="#5a2ee5"/>
  <rect x="630" y="270" width="170" height="190" fill="#4520c4"/>

  <!-- Ventanas encendidas -->
  <g fill="#d9bf74">
    <rect x="20" y="310" width="18" height="22"/><rect class="luz" x="58" y="310" width="18" height="22"/><rect x="134" y="352" width="18" height="22"/>
    <rect x="96" y="394" width="18" height="22"/><rect x="20" y="394" width="18" height="22"/>
    <rect x="182" y="340" width="16" height="20"/><rect class="luz luz-2" x="250" y="340" width="16" height="20"/><rect x="216" y="376" width="16" height="20"/>
    <rect x="520" y="330" width="16" height="20"/><rect class="luz luz-2" x="588" y="366" width="16" height="20"/><rect x="554" y="330" width="16" height="20"/>
    <rect x="650" y="290" width="18" height="22"/><rect class="luz luz-3" x="726" y="290" width="18" height="22"/><rect x="688" y="332" width="18" height="22"/>
    <rect x="764" y="374" width="18" height="22"/><rect x="650" y="374" width="18" height="22"/>
  </g>
  <g fill="#6b45f0">
    <rect x="58" y="352" width="18" height="22"/><rect x="96" y="310" width="18" height="22"/>
    <rect x="216" y="340" width="16" height="20"/><rect x="622" y="330" width="16" height="20"/>
    <rect x="764" y="290" width="18" height="22"/><rect x="726" y="374" width="18" height="22"/>
  </g>

  <!-- Sucursal: planta baja con cartel de la marca -->
  <rect x="630" y="410" width="170" height="50" fill="#15131f"/>
  <rect x="646" y="418" width="44" height="30" rx="8" fill="#5a2ee5"/>
  <text x="668" y="439" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">BA</text>
  <text x="702" y="439" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#efeafd">Banco Andino</text>

  <!-- Vereda y avenida en perspectiva -->
  <rect x="0" y="460" width="800" height="100" fill="#211f2d"/>
  <polygon points="330,460 470,460 640,560 160,560" fill="#2d2a3a"/>
  <!-- Senda peatonal -->
  <g fill="#efeafd" opacity="0.85">
    <rect x="300" y="532" width="26" height="10"/><rect x="346" y="532" width="26" height="10"/>
    <rect x="392" y="532" width="26" height="10"/><rect x="438" y="532" width="26" height="10"/>
    <rect x="484" y="532" width="26" height="10"/>
  </g>
  <!-- Línea central -->
  <g fill="#d9bf74">
    <rect x="397" y="466" width="6" height="12"/><rect x="396" y="490" width="8" height="16"/>
  </g>

  <!-- Colectivo -->
  <g class="colectivo">
    <rect x="186" y="476" width="132" height="54" rx="10" fill="#efeafd"/>
    <rect x="186" y="512" width="132" height="10" fill="#5a2ee5"/>
    <rect x="198" y="486" width="24" height="18" rx="3" fill="#15131f"/>
    <rect x="230" y="486" width="24" height="18" rx="3" fill="#15131f"/>
    <rect x="262" y="486" width="24" height="18" rx="3" fill="#15131f"/>
    <rect x="294" y="486" width="16" height="18" rx="3" fill="#d9bf74"/>
    <circle cx="214" cy="532" r="10" fill="#15131f"/><circle cx="292" cy="532" r="10" fill="#15131f"/>
  </g>

  <!-- Faroles -->
  <g fill="#efeafd">
    <rect x="128" y="404" width="4" height="56"/><rect x="668" y="372" width="4" height="38"/>
  </g>
  <g fill="#d9bf74">
    <circle cx="130" cy="402" r="7"/><circle cx="670" cy="370" r="6"/>
  </g>
</svg>
